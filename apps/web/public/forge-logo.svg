<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <title>Forged Gear Anvil Logo</title>
  <desc>A glowing orange ring surrounds an anvil, sparks and a tilted hammer, backed by a dark steel gear.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="47%" r="72%">
      <stop offset="0" stop-color="#0c0e15"/>
      <stop offset="0.7" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#10121b"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#484952"/>
      <stop offset="0.5" stop-color="#41424b"/>
      <stop offset="1" stop-color="#474850"/>
    </linearGradient>
    <linearGradient id="hammerSteel" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#55555f"/>
      <stop offset="1" stop-color="#4a4b55"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fa6b11"/>
      <stop offset="1" stop-color="#ff9215"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f86c14" stop-opacity=".35"/>
      <stop offset=".42" stop-color="#d34d0e" stop-opacity=".15"/>
      <stop offset="1" stop-color="#9c310a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1254" height="1254" fill="url(#background)"/>

  <!-- The gear is a single editable silhouette behind the ring. -->
  <path id="gear" fill="url(#steel)" d="
    M 579 129 Q 626 127 675 129 Q 678 129 679 133
    L 699 204 Q 738 212 774 227 L 828 180 Q 831 177 835 180
    Q 881 206 922 239 Q 926 242 923 247 L 899 310
    Q 928 339 951 374 L 1020 360 Q 1025 359 1027 364
    Q 1053 408 1070 459 Q 1072 463 1069 466 L 1010 509
    Q 1017 548 1017 587 L 1078 620 Q 1083 622 1081 627
    Q 1074 677 1060 724 Q 1059 728 1055 728 L 986 734
    Q 970 772 948 806 L 981 864 Q 984 868 980 872
    Q 945 913 903 948 Q 900 951 896 949 L 839 916
    Q 783 953 718 967 L 698 1030 Q 697 1034 692 1034
    Q 626 1039 559 1034 Q 555 1034 554 1030 L 534 967
    Q 468 953 414 916 L 356 949 Q 352 951 349 948
    Q 307 913 271 871 Q 268 868 271 864 L 304 806
    Q 282 772 266 734 L 197 728 Q 193 728 192 724
    Q 178 677 171 627 Q 169 622 173 620 L 234 587
    Q 234 548 241 509 L 181 466 Q 178 464 180 459
    Q 197 408 224 364 Q 226 359 231 360 L 301 374
    Q 324 339 354 310 L 329 247 Q 326 242 330 239
    Q 371 206 417 180 Q 421 177 424 180 L 478 227
    Q 514 212 554 204 L 574 133 Q 575 129 579 129 Z"/>

  <!-- The dark center leaves the gear visible as an annulus around the ring. -->
  <circle cx="625" cy="592" r="337" fill="url(#background)"/>
  <circle id="ring" cx="625" cy="592" r="337" fill="none" stroke="url(#orange)" stroke-width="20"/>

  <ellipse cx="593" cy="572" rx="115" ry="56" fill="url(#forgeGlow)"/>

  <!-- Hammer handle, then head and its hot striking face. -->
  <path id="hammer-handle" fill="url(#hammerSteel)" d="M 703 402 L 916 495 Q 919 496 920 501 L 928 535 Q 929 539 926 544 L 919 554 Q 915 562 905 558 L 679 459 Z"/>
  <path id="hammer-head" fill="url(#hammerSteel)" d="M 638 303 Q 643 297 651 301 L 709 326 Q 721 331 716 342 L 638 518 L 553 482 L 579 395 Q 580 390 585 382 Z"/>
  <path id="hammer-face" fill="#ff9614" d="M 553 482 L 638 518 L 635 525 Q 631 535 621 531 L 558 504 Q 548 500 551 491 Z"/>

  <g id="sparks" fill="#ff8e12">
    <path d="M 464 389 L 508 437 L 531 505 L 498 460 Z"/>
    <path d="M 406 453 L 485 494 L 547 559 L 488 522 Z"/>
    <path d="M 407 544 L 455 537 L 500 557 Z"/>
    <path d="M 633 563 L 667 534 L 712 513 L 673 546 Z"/>
  </g>

  <!-- The anvil's hot top flows into the central tapered highlight. -->
  <path id="anvil" fill="url(#steel)" d="M 336 576 L 905 576 Q 903 595 891 617 Q 887 626 878 629
    C 823 645 775 657 746 684 C 724 704 718 724 722 745
    C 727 775 751 800 779 801 Q 788 801 790 809 L 797 842 Q 798 845 794 845
    L 712 845 Q 710 845 709 842 L 703 811 Q 702 804 695 804
    L 548 804 Q 541 804 540 811 L 533 842 Q 533 845 530 845
    L 449 845 Q 445 845 446 841 L 454 809 Q 455 802 463 801
    C 488 800 512 777 517 748 C 522 720 510 700 491 683
    C 466 660 426 650 397 641 C 368 632 350 612 341 595 Q 337 585 336 576 Z"/>
  <path id="anvil-hot-edge" fill="#ff9915" d="M 336 576 L 905 576 Q 905 584 901 595 L 770 595
    C 725 595 690 596 665 602 C 632 609 614 630 608 666
    C 601 633 585 612 559 604 C 533 596 495 595 450 595 L 343 595 Q 338 585 336 576 Z"/>
</svg>
