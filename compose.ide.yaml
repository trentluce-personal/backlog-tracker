name: forge-ide

services:
  ide:
    build:
      context: .
      dockerfile: ide/Dockerfile
    ports:
      - "127.0.0.1:${IDE_PORT:-8080}:8080"
    environment:
      HOME: /home/coder
    volumes:
      - workspace-data:/workspace
      - ide-data:/home/coder/.local/share/code-server
      - opencode-data:/home/coder/.local/share/opencode
    restart: unless-stopped

volumes:
  workspace-data:
  ide-data:
  opencode-data:
