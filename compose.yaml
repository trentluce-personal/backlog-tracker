services:
  app:
    build: .
    ports:
      - "127.0.0.1:${BACKLOG_HOST_PORT:-3001}:3001"
    environment:
      BACKLOG_HOST: 0.0.0.0
      PORT: "3001"
      BACKLOG_DB_PATH: /app/data/backlog.sqlite
      BACKLOG_MODEL_PATH: /app/models/model.json
    volumes:
      - backlog-data:/app/data
      - ./data/models:/app/models
    stop_grace_period: 20s

volumes:
  backlog-data:
